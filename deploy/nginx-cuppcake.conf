# Боевой конфиг: /etc/nginx/sites-available/cuppcake
# Раскатка: scripts/deploy-nginx.sh
# Строки «managed by Certbot» после выпуска сертификата не затирать вручную без бэкапа.

map $http_upgrade $cuppcake_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name cuppcake.my-crazy-master.ru;

    client_max_body_size 20m;

    location /_next/static {
        proxy_pass http://127.0.0.1:3001/_next/static;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/www-root/data/product-catalog-next-app/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cuppcake_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/cuppcake.my-crazy-master.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cuppcake.my-crazy-master.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = cuppcake.my-crazy-master.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name cuppcake.my-crazy-master.ru;
    return 404; # managed by Certbot
}
