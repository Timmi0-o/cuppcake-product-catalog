# HTTP-only bootstrap для первого выпуска сертификата Certbot.
# После certbot --nginx конфиг обычно перезаписывается; дальше используй nginx-cuppcake.conf.

map $http_upgrade $cuppcake_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cuppcake.my-crazy-master.ru;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cuppcake_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
