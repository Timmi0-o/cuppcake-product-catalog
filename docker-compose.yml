services:
  postgres:
    image: postgres:16-alpine
    container_name: product-catalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: product_catalog
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d product_catalog']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
